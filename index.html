<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify to Trust AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#2fe39a;--g2:#1a8f62;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden}
body{min-height:100vh;position:relative}
.bg{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse 60% 40% at 50% 38%,rgba(20,70,50,.35),transparent 70%),#000}
.bg svg{position:absolute;left:50%;top:0;transform:translateX(-50%);width:max(100%,1400px);height:760px}
.arc{fill:none;stroke-linecap:round}
.glow{filter:blur(6px)}
@keyframes drift{0%,100%{opacity:.55}50%{opacity:1}}
.arc-a{animation:drift 6s ease-in-out infinite}
.arc-b{animation:drift 6s ease-in-out infinite 1.5s}
.trace{fill:none;stroke:rgba(120,255,200,.16);stroke-width:1}
.pulse{fill:none;stroke:url(#pg);stroke-width:2;stroke-linecap:round;stroke-dasharray:36 1200;animation:run 3.2s linear infinite;filter:drop-shadow(0 0 4px #2fe39a)}
@keyframes run{from{stroke-dashoffset:60}to{stroke-dashoffset:-900}}
.node{fill:#0c1210;stroke:rgba(255,255,255,.14)}
nav{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:20px 32px}
.logo{font-weight:600;letter-spacing:.02em;font-size:18px}.logo span{font-weight:300}
.menu{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);backdrop-filter:blur(10px)}
.menu a{color:#e8e8e8;text-decoration:none;font-size:13px;padding:6px 10px;border-radius:8px;transition:background .2s}
.menu a:hover{background:rgba(255,255,255,.08)}
.menu a.dd::after{content:"";display:inline-block;width:5px;height:5px;margin-left:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg)}
.right{display:flex;gap:10px}
.btn{font:500 13px Inter,sans-serif;padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:transparent;color:#fff;cursor:pointer}
.btn.w{background:#fff;color:#000;border-color:#fff}
main{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 20px 60px}
.chip{position:relative;width:104px;height:104px;margin-top:40px}
.chip canvas{position:absolute;left:-98px;top:-118px;width:300px;height:260px;pointer-events:none}
.chip b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:600;letter-spacing:.02em;color:#f4f4f4;text-shadow:0 0 12px rgba(0,0,0,.9);animation:fade 1.2s ease 2.6s both}
/* opening sequence: everything rises from below */
@keyframes rise{from{opacity:0;transform:translateY(140px)}to{opacity:1;transform:none}}
@keyframes riseBg{from{opacity:0;transform:translate(-50%,260px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.bg svg{animation:riseBg 1.9s cubic-bezier(.16,1,.3,1) both}
nav{animation:fade 1s ease .9s both}
.chip{animation:rise 1.5s cubic-bezier(.16,1,.3,1) .35s both}
h1{animation:rise 1.5s cubic-bezier(.16,1,.3,1) .5s both}
.sub{animation:rise 1.5s cubic-bezier(.16,1,.3,1) .65s both}
.cta{animation:rise 1.5s cubic-bezier(.16,1,.3,1) .8s both}
.pre{animation:rise 1.5s cubic-bezier(.16,1,.3,1) .95s both}
.cards{animation:rise 1.5s cubic-bezier(.16,1,.3,1) 1.1s both}
#tr{animation:fade 1.2s ease 1.4s both}
h1{margin-top:22px;font-size:clamp(44px,7.4vw,88px);font-weight:500;letter-spacing:-.035em;line-height:1.02;background:linear-gradient(180deg,#fff 20%,#a9aeb0);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:18px;max-width:340px;font-size:15px;line-height:1.45;color:#cfd4d2}
.cta{margin-top:22px;display:inline-flex;align-items:center;gap:10px;padding:4px 14px 4px 4px;border-radius:10px;background:#fff;color:#000;font:500 13px Inter,sans-serif;border:0;cursor:pointer;box-shadow:0 0 30px rgba(47,227,154,.3)}
.cta i{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:linear-gradient(180deg,#46e8a4,#1fa972);font-style:normal;color:#fff;font-size:12px}
.pre{margin-top:70px;font-size:12px;color:#d0d4d2}
.cards{margin-top:14px;display:flex;gap:6px}
.card{width:92px;height:76px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;line-height:1.15;color:#e6e6e6;transition:border-color .25s,transform .25s}
.card:hover{border-color:rgba(120,255,200,.5);transform:translateY(-2px)}
.card em{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.08);font-style:normal;font-size:12px}
@media(max-width:720px){.menu{display:none}nav{padding:16px}.cards{flex-wrap:wrap;justify-content:center}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="bg">
<svg viewBox="0 0 1400 760" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
<defs>
<linearGradient id="ag" x1="0" x2="1"><stop offset="0" stop-color="#2fe39a" stop-opacity="0"/><stop offset=".35" stop-color="#3ff0ad" stop-opacity=".9"/><stop offset=".5" stop-color="#b9ffe3" stop-opacity="1"/><stop offset=".65" stop-color="#3ff0ad" stop-opacity=".9"/><stop offset="1" stop-color="#2fe39a" stop-opacity="0"/></linearGradient>
<linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#2fe39a" stop-opacity="0"/><stop offset="1" stop-color="#d6fff0"/></linearGradient>
</defs>
<!-- lens arcs -->
<g class="arc-a">
<path class="arc glow" d="M-80 215 Q700 470 1480 215" stroke="url(#ag)" stroke-width="10"/>
<path class="arc" d="M-80 215 Q700 470 1480 215" stroke="url(#ag)" stroke-width="2"/>
<path class="arc" d="M-80 240 Q700 500 1480 240" stroke="url(#ag)" stroke-width="1" opacity=".5"/>
<path class="arc" d="M-80 190 Q700 440 1480 190" stroke="url(#ag)" stroke-width="1" opacity=".4"/>
</g>
<g class="arc-b">
<path class="arc glow" d="M-80 640 Q700 140 1480 640" stroke="url(#ag)" stroke-width="10"/>
<path class="arc" d="M-80 640 Q700 140 1480 640" stroke="url(#ag)" stroke-width="2"/>
<path class="arc" d="M-80 610 Q700 115 1480 610" stroke="url(#ag)" stroke-width="1" opacity=".45"/>
<path class="arc" d="M-80 670 Q700 170 1480 670" stroke="url(#ag)" stroke-width="1" opacity=".35"/>
</g>
<!-- circuit traces from chip (700,125) -->
<g id="tr">
<path class="trace" d="M652 120 H520 L470 160 H210"/>
<path class="trace" d="M652 130 H560 L520 168 H300 L262 205 H120"/>
<path class="trace" d="M748 120 H880 L930 160 H1190"/>
<path class="trace" d="M748 130 H840 L880 168 H1100 L1138 205 H1280"/>
<path class="trace" d="M700 172 V215"/>
<path class="pulse" d="M652 120 H520 L470 160 H210" style="animation-delay:0s"/>
<path class="pulse" d="M652 130 H560 L520 168 H300 L262 205 H120" style="animation-delay:1.2s"/>
<path class="pulse" d="M748 120 H880 L930 160 H1190" style="animation-delay:.6s"/>
<path class="pulse" d="M748 130 H840 L880 168 H1100 L1138 205 H1280" style="animation-delay:1.8s"/>
</g>
<g>
<rect class="node" x="190" y="146" width="28" height="28" rx="7"/><rect class="node" x="100" y="191" width="28" height="28" rx="7"/>
<rect class="node" x="1182" y="146" width="28" height="28" rx="7"/><rect class="node" x="1272" y="191" width="28" height="28" rx="7"/>
</g>
</svg>
</div>

<nav>
<div class="logo">EQTY<span>LAB</span></div>
<div class="menu"><a href="#">Overview</a><a href="#">Technology</a><a href="#" class="dd">Testimonials</a><a href="#">Resources</a></div>
<div class="right"><button class="btn">Log In</button><button class="btn w">Get Started</button></div>
</nav>

<main>
<div class="chip"><canvas id="gpu"></canvas><b>EQTY</b></div>
<h1>Verify to Trust AI</h1>
<p class="sub">Introducing Verifiable Compute. Ready for the Agentic AI Era.</p>
<button class="cta"><i>&#10095;</i>Schedule Demo</button>
<div class="pre">Preorders Q4 Ship 2025</div>
<div class="cards">
<div class="card"><em>&#8599;</em><span>Dell<br>Appliance</span></div>
<div class="card"><em>&#8599;</em><span>Cloud<br>Provider</span></div>
<div class="card"><em>&#8599;</em><span>Accenture<br>AIP Platform</span></div>
</div>
</main>

<script>
// Chip: glitch neon cube -> dark glass chip with ring of cells + light beams
(function(){
  var c=document.getElementById('gpu'),x=c.getContext('2d'),CW=300,CH=260,D=window.devicePixelRatio||1;
  c.width=CW*D;c.height=CH*D;x.scale(D,D);
  var still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var cx=150,cy=170,S=104,t0=performance.now();
  function rr(X,Y,w,h,r){x.beginPath();if(x.roundRect)x.roundRect(X,Y,w,h,r);else x.rect(X,Y,w,h)}
  function rnd(n){var v=Math.sin(n*127.1+311.7)*43758.5453;return v-Math.floor(v)}
  function sm(a,b,t){t=Math.min(1,Math.max(0,(t-a)/(b-a)));return t*t*(3-2*t)}
  // ring cells, clockwise from top-left
  var ring=[],n=6,i;
  for(i=0;i<n;i++)ring.push([i,0]);
  for(i=1;i<n;i++)ring.push([n-1,i]);
  for(i=n-2;i>=0;i--)ring.push([i,n-1]);
  for(i=n-2;i>0;i--)ring.push([0,i]);
  var hollow={7:1,16:1,21:1};
  function glitch(t,alpha){
    var sc=.55+.5*sm(.3,2.4,t),f=Math.floor(t*14);
    x.save();x.translate(cx,cy);x.scale(sc,sc);x.globalAlpha=alpha;
    x.shadowColor='#2fe3c0';x.shadowBlur=26;
    for(var k=0;k<34;k++){
      var r1=rnd(k*3+f),r2=rnd(k*7+f*2),r3=rnd(k*11+f),
          w=6+r1*38,h=3+r2*16,X=(rnd(k+f*5)-.5)*70-w/2,Y=(rnd(k*5+f*3)-.5)*70-h/2,
          hue=r3<.5?'60,230,200':r3<.8?'60,200,255':'120,255,160';
      x.fillStyle='rgba('+hue+','+(.12+.25*r2)+')';x.fillRect(X,Y,w,h);
      x.strokeStyle='rgba('+hue+','+(.5+.4*r1)+')';x.lineWidth=1;x.strokeRect(X+.5,Y+.5,w,h);
    }
    x.shadowBlur=0;x.strokeStyle='rgba(120,255,225,.9)';x.lineWidth=1.5;x.strokeRect(-36,-36,72,72);
    x.restore();
  }
  function chip(t,A){
    x.save();x.globalAlpha=A;
    // bezel
    x.shadowColor='rgba(47,227,154,.55)';x.shadowBlur=30;
    var g=x.createLinearGradient(0,cy-S/2,0,cy+S/2);g.addColorStop(0,'#10281e');g.addColorStop(1,'#060d0a');
    rr(cx-S/2,cy-S/2,S,S,20);x.fillStyle=g;x.fill();x.shadowBlur=0;
    var e=x.createLinearGradient(0,cy-S/2,0,cy+S/2);e.addColorStop(0,'rgba(70,220,140,.95)');e.addColorStop(.5,'rgba(30,120,80,.6)');e.addColorStop(1,'rgba(20,80,55,.45)');
    rr(cx-S/2+1,cy-S/2+1,S-2,S-2,19);x.strokeStyle=e;x.lineWidth=2;x.stroke();
    // inner dark well
    rr(cx-S/2+9,cy-S/2+9,S-18,S-18,13);x.fillStyle='#030705';x.fill();
    x.strokeStyle='rgba(60,170,120,.18)';x.lineWidth=1;x.stroke();
    // ring cells with chasing highlight
    var cs=11.5,pitch=12.4,gx=cx-(n*pitch)/2+.5,gy=cy-(n*pitch)/2+.5,L=ring.length,head=(t*7)%L;
    ring.forEach(function(p,k){
      var X=gx+p[0]*pitch,Y=gy+p[1]*pitch,d=(head-k+L)%L,
          trail=d<7?Math.pow(1-d/7,1.6):0,
          fl=Math.max(0,Math.sin(t*1.7+k*2.3))>.93?.8:0,
          a=Math.min(1,.16+.1*Math.sin(t*1.2+k)+trail+fl);
      if(hollow[k]){x.strokeStyle='rgba(80,200,140,'+(.25+.5*trail)+')';x.lineWidth=1;x.strokeRect(X+.5,Y+.5,cs-1,cs-1);return}
      if(a>.5){x.shadowColor='#37ff9a';x.shadowBlur=10*a}
      x.fillStyle='rgba('+Math.round(60+a*20)+','+Math.round(120+a*135)+','+Math.round(95+a*60)+','+(.35+a*.65)+')';
      x.beginPath();
      if(k==n-1&&x.roundRect)x.roundRect(X,Y,cs,cs,[1,6,1,1]);else x.rect(X,Y,cs,cs);x.fill();x.shadowBlur=0;
    });
    // center plate
    rr(cx-23,cy-23,46,46,6);x.fillStyle='rgba(4,10,8,.96)';x.fill();
    x.restore();
  }
  function beams(t,A){
    x.save();x.globalAlpha=A;var top=cy-S/2;
    [-27,-9,9,27].forEach(function(dx,k){
      var X=cx+dx+.5,g=x.createLinearGradient(0,top,0,0);g.addColorStop(0,'rgba(120,255,200,.28)');g.addColorStop(1,'rgba(120,255,200,0)');
      x.strokeStyle=g;x.lineWidth=1;x.beginPath();x.moveTo(X,top);x.lineTo(X,0);x.stroke();
      if(k==1||k==2){
        var y=top-((t*(40+k*14)+k*37)%(top+30));
        x.shadowColor='#37ff9a';x.shadowBlur=12;
        var pg=x.createLinearGradient(0,y+14,0,y-14);pg.addColorStop(0,'rgba(60,255,160,0)');pg.addColorStop(.5,'rgba(120,255,190,.95)');pg.addColorStop(1,'rgba(60,255,160,0)');
        x.strokeStyle=pg;x.lineWidth=2.4;x.beginPath();x.moveTo(X,y+14);x.lineTo(X,y-14);x.stroke();
      }
    });
    // faint side lines
    x.shadowBlur=0;x.strokeStyle='rgba(120,255,200,.12)';
    for(var j=-1;j<=1;j+=2)for(var m=0;m<3;m++){var Y=cy-10+m*8;x.beginPath();x.moveTo(cx+j*S/2,Y);x.lineTo(cx+j*(S/2+50),Y);x.stroke()}
    x.restore();
  }
  function frame(){
    var t=still?9:(performance.now()-t0)/1000;
    x.clearRect(0,0,CW,CH);x.globalCompositeOperation='lighter';
    var gl=sm(.2,.6,t)*(1-sm(2.1,3.1,t)),ch=sm(2.0,3.0,t),bm=sm(2.8,3.8,t);
    if(gl>0)glitch(t,gl);
    x.globalCompositeOperation='source-over';
    if(bm>0)beams(t,bm);
    if(ch>0)chip(t,ch);
    if(!still)requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
